name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend Rust Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DeepSeek-LeanSpark

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Lean4 (elan)
        run: |
          # Install elan (Lean4 toolchain manager) - official method
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            DeepSeek-LeanSpark/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('DeepSeek-LeanSpark/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Compile
        run: cargo build --verbose

      - name: Lib unit tests
        run: cargo test --lib

  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DeepSeek-LeanSpark/frontend

    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: DeepSeek-LeanSpark/frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Component tests
        run: npm test -- --run

      - name: Type check and build
        run: npm run build
