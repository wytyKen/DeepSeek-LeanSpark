name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: 后端 Rust 检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DeepSeek-LeanSpark

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 安装 Lean4
        uses: leanprover/lean-action@v1
        with:
          lean-toolchain: stable

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            DeepSeek-LeanSpark/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('DeepSeek-LeanSpark/Cargo.lock') }}

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 编译
        run: cargo build --verbose

      - name: 启动后端
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          LEAN_BIN_PATH: lean
          LISTEN_ADDR: 127.0.0.1:3000
          RUST_LOG: info
        run: |
          cargo run &
          sleep 5

      - name: 端到端烟雾测试
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: cargo test --test api_smoke -- --test-threads=1

  frontend:
    name: 前端构建检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DeepSeek-LeanSpark/frontend

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: DeepSeek-LeanSpark/frontend/package-lock.json

      - name: 安装依赖
        run: npm install

      - name: 类型检查与构建
        run: npm run build
